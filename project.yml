# XcodeGen spec. On a Mac: `brew install xcodegen && xcodegen` then open Stillfast.xcodeproj.
#
# BASE_BUNDLE_ID is the app's permanent ID. The widget ID, the App Group and the iCloud
# container are derived from it automatically.
# Put your 10-character Apple Team ID in DEVELOPMENT_TEAM (or pick the team in Xcode for both targets).
name: Stillfast

options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    BASE_BUNDLE_ID: com.alishasutcliffe.stillfast
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"

packages:
  FastingCore:
    path: Packages/FastingCore

targets:
  Stillfast:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Stillfast
        AppGroupID: group.$(BASE_BUNDLE_ID)
        CloudContainerID: iCloud.$(BASE_BUNDLE_ID)
        NSSupportsLiveActivities: true
        UIBackgroundModes: [remote-notification]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: $(BASE_BUNDLE_ID)
            CFBundleURLSchemes: [stillfast]
    entitlements:
      path: App/Stillfast.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(BASE_BUNDLE_ID)
        com.apple.developer.icloud-container-identifiers:
          - iCloud.$(BASE_BUNDLE_ID)
        com.apple.developer.icloud-services:
          - CloudKit
        aps-environment: development
    dependencies:
      - target: StillfastWidget
      - package: FastingCore

  StillfastWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID).widget
    dependencies:
      - package: FastingCore
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Stillfast
        AppGroupID: group.$(BASE_BUNDLE_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/StillfastWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(BASE_BUNDLE_ID)
